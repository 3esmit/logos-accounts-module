---------------------------------------------------------\naccounts_module                1.0.1           core       accounts       \ncapability_module              1.0.0           core       security       \n", "note": ""}]}, {"md": "## Step 4: Run the daemon and call the module\n\nStart `logoscore` in daemon mode pointed at `./modules`, then use the client\nsubcommands to load `accounts_module`, introspect it, and call several of its\nmethods. Daemon output is captured in `logs.txt`.", "execs": []}, {"md": "### 4.1 Start the daemon\n\nStart logoscore in daemon mode in the background, capturing output to\n`logs.txt`:\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```\n\nThe `-D` flag starts the daemon. The client subcommands below connect to\nthis running process via the config written under `~/.logoscore/`.", "execs": [{"kind": "run", "cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "```bash\nsleep 3\n```", "execs": [{"kind": "run", "cmd": "sleep 3", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 4.2 Inspect the startup log\n\nReview the daemon's startup output:\n\n```bash\ncat logs.txt\n```", "execs": [{"kind": "run", "cmd": "cat logs.txt", "status": "pass", "exit_code": 0, "output": "[2026-08-08 18:02:40.595] [warning] [logos] [capability_module] Warning: QObject::connect: No such signal CapabilityModulePlugin::eventResponse(QString, QVariantList)\n[2026-08-08 18:02:40.821] [info] [logos] Module loaded: capability_module\nLogosctl daemon started (pid 7179, instance df835b43e507)\nDaemon state: /tmp/doctest-test-mpwtav74/.logoscore/daemon/state.json\nLocal client config: /tmp/doctest-test-mpwtav74/.logoscore/client/config.json\n", "note": ""}]}, {"md": "### 4.3 Check daemon status\n\nVerify the daemon is running:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status", "status": "pass", "exit_c sInvokable\":true,\"name\":\"extKeystoreFind\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"url\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"extKeystoreFind(QString,QString)\"},{\"isInvokable\":true,\"name\":\"createExtKeyFromMnemonic\",\"parameters\":[{\"name\":\"phrase\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"createExtKeyFromMnemonic(QString,QString)\"},{\"isInvokable\":true,\"name\":\"deriveExtKey\",\"parameters\":[{\"name\":\"extKeyStr\",\"type\":\"QString\"},{\"name\":\"pathStr\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"deriveExtKey(QString,QString)\"},{\"isInvokable\":true,\"name\":\"extKeyToECDSA\",\"parameters\":[{\"name\":\"extKeyStr\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"extKeyToECDSA(QString)\"},{\"isInvokable\":true,\"name\":\"ecdsaToPublicKey\",\"parameters\":[{\"name\":\"privateKeyECDSAStr\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"ecdsaToPublicKey(QString)\"},{\"isInvokable\":true,\"name\":\"publicKeyToAddress\",\"parameters\":[{\"name\":\"publicKeyStr\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"publicKeyToAddress(QString)\"},{\"isInvokable\":true,\"name\":\"createRandomMnemonic\",\"parameters\":[{\"name\":\"length\",\"type\":\"int\"}],\"returnType\":\"QString\",\"signature\":\"createRandomMnemonic(int)\"},{\"isInvokable\":true,\"name\":\"createRandomMnemonicWithDefaultLength\",\"returnType\":\"QString\",\"signature\":\"createRandomMnemonicWithDefaultLength()\"},{\"isInvokable\":true,\"name\":\"lengthToEntropyStrength\",\"parameters\":[{\"name\":\"length\",\"type\":\"int\"}],\"returnType\":\"int\",\"signature\":\"lengthToEntropyStrength(int)\"}],\"name\":\"accounts_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"1.0.1\"}\n", "note": ""}]}, {"md": "### 4.8 Generate a random mnemonic\n\n`createRandomMnemonic` takes a word count and returns a fresh BIP-39\nphrase \u2014 a real round-trip through the go-wallet-sdk C library wrapped by\nthe module, dispatched over liblogos' IPC:\n\n```bash\nlogoscore call accounts_module createRandomMnemonic 12\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module createRandomMnemonic 12", "status": "pass", "exit_code": 0, "output": "{\"method\":\"createRandomMnemonic\",\"module\":\"accounts_module\",\"result\":\"exile dinner pass area depth once core evolve liar silver slight cement\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.9 Generate a default-length mnemonic\n\n`createRandomMnemonicWithDefaultLength` takes no arguments and returns a\nphrase of the SDK's default length:\n\n```bash\nlogoscore call accounts_module createRandomMnemonicWithDefaultLength\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module createRandomMnemonicWithDefaultLength", "status": "pass", "exit_code": 0, "output": "{\"method\":\"createRandomMnemonicWithDefaultLength\",\"module\":\"accounts_module\",\"result\":\"buzz lens extend behind river cost present secret animal discover stumble call\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.10 Map a word count to entropy strength\n\n`lengthToEntropyStrength` maps a mnemonic word count to its entropy\nstrength in bits \u2014 12 words is 128 bits. This exercises an `int`\nround-trip:\n\n```bash\nlogoscore call accounts_module lengthToEntropyStrength 12\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module lengthToEntropyStrength 12", "status": "pass", "exit_code": 0, "output": "{\"method\":\"lengthToEntropyStrength\",\"module\":\"accounts_module\",\"result\":128,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nlogoscore call accounts_module lengthToEntropyStrength 24\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module lengthToEntropyStrength 24", "status": "pass", "exit_code": 0, "output": "{\"method\":\"lengthToEntropyStrength\",\"module\":\"accounts_module\",\"result\":256,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.11 Create and use a keystore\n\nInitialise a keystore in a fresh directory (`scryptN`=4096, `scryptP`=6\nkeep the test fast), then create a new account in it. `keystoreNewAccount`\nreturns the new account's address:\n\n```bash\nlogoscore call accounts_module initKeystore ./ks 4096 6\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module initKeystore ./ks 4096 6", "status": "pass", "exit_code": 0, "output": "{\"method\":\"initKeystore\",\"module\":\"accounts_module\",\"result\":true,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nlogoscore call accounts_module keystoreNewAccount test-passphrase\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module keystoreNewAccount test-passphrase", "status": "pass", "exit_code": 0, "output": "{\"method\":\"keystoreNewAccount\",\"module\":\"accounts_module\",\"result\":\"{\\\"address\\\":\\\"0x636bc9f94B5e3dAD8fCD412d881fb46dBCfe6f4F\\\",\\\"url\\\":\\\"keystore:///tmp/doctest-test-mpwtav74/ks/UTC--2026-08-08T18-02-43.784614314Z--636bc9f94b5e3dad8fcd412d881fb46dbcfe6f4f\\\"}\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.12 List the keystore's accounts\n\n`keystoreAccounts` returns the accounts now present in the keystore \u2014 the\none we just created:\n\n```bash\nlogoscore call accounts_module keystoreAccounts\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module keystoreAccounts", "status": "pass", "exit_code": 0, "output": "{\"method\":\"keystoreAccounts\",\"module\":\"accounts_module\",\"result\":[\"{\\\"address\\\":\\\"0x636bc9f94B5e3dAD8fCD412d881fb46dBCfe6f4F\\\",\\\"url\\\":\\\"keystore:///tmp/doctest-test-mpwtav74/ks/UTC--2026-08-08T18-02-43.784614314Z--636bc9f94b5e3dad8fcd412d881fb46dbcfe6f4f\\\"}\"],\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.13 Stop the daemon\n\nShut the daemon down cleanly:\n\n```bash\nlogoscore stop\n```\n\nThe daemon removes its state file and exits.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore stop", "status": "pass", "exit_code": 0, "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nsleep 2\n```", "execs": [{"kind": "run", "cmd": "sleep 2", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 4.14 Confirm the daemon has stopped\n\nWith no daemon running, the client reports `not_running` and exits\nnon-zero, so we add `|| true` to let the doc-test assert on the output:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status || true", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"instance_id\":\"df835b43e507\",\"status\":\"not_running\",\"version\":\"pre-release-d015a40\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "note": ""}]}]}, {"meta": {"name": "Driving the Accounts UI Against This Module", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"md": "# Driving the Accounts UI Against This Module\n\nThe companion to the [headless runtime doc-test](accounts-module-runtime.md):\ninstead of calling `accounts_module` through the `logoscore` daemon, this one\ndrives the real **[`logos-accounts-ui`](https://github.com/logos-co/logos-accounts-ui)**\ndesktop app against **this** commit of the module.\n\n`logos-accounts-ui` is a QML UI plugin built with\n[`logos-app-builder`](https://github.com/logos-co/logos-app-builder), so its\nflake exposes a standalone app (`apps.default`) that `nix run` launches in its\nown window with all backend module dependencies bundled and auto-loaded. The\nUI declares `accounts_module` as a flake input, so we build the app with an\n`--override-input` that points that input at the commit under test. The UI then\ntalks to **this** module over the Logos IPC bridge, exactly as it would in\n`logos-basecamp`.\n\nThe app is launched headless (`QT_QPA_PLATFORM=offscreen`) and driven through\nthe QML inspector via [`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp):\nwe wait for elements to appear, type into inputs, click buttons, assert on the\nresults the module returns, and capture screenshots that are embedded in the\nrendered tutorial and the CI report.\n\n**What you'll build:** The `logos-accounts-ui` standalone app, built against this `accounts_module` commit and driven headlessly through its QML UI.\n\n**What you'll learn:**\n\n- How a UI built with `logos-app-builder` exposes a standalone `nix run` app\n- How to override the UI's module input so it runs against a specific module commit\n- How to drive a headless Qt/QML app with logos-qt-mcp (wait, type, click, assert)\n- How to capture screenshots of the running UI for documentation and CI reports\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **A Linux or macOS machine.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required.", "execs": []}, {"md": "## How the standalone UI app works\n\n`logos-accounts-ui` is a QML UI plugin (`accounts_ui`) that declares\n`accounts_module` as a dependency. Because it is built with\n`logos-app-builder`, its flake's `apps.default` is a self-contained desktop\napp:\n\n```\n+----------------------+   backend.createRandomMnemonic()   +-------------------+\n|     accounts_ui      | --------------------------------->  |  accounts_module  |\n|  AccountsView.qml    |   IPC (Logos API bridge)            |   C++ plugin      |\n+----------------------+                                     +-------------------+\n           ^                                                          ^\n           \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 bundled & launched by \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                           logos-app-builder standalone app\n```\n\nThe standalone app bundles every module dependency (here `accounts_module`)\nand loads it automatically at startup \u2014 so when the QML calls\n`backend.lengthToEntropyStrength(12)`, the call travels over the Logos bridge\nto the real module and comes back with `128`. By overriding the\n`accounts_module` input at build time we make that backend **this** commit.", "execs": []}, {"md": "## Step 1: Clone the UI\n\nClone [`logos-accounts-ui`](https://github.com/logos-co/logos-accounts-ui).\nWe clone over HTTPS so the step works in CI; over SSH the URL is\n`git@github.com:logos-co/logos-accounts-ui.git`.", "execs": []}, {"md": "### 1.1 git clone\n\n```bash\ngit clone --depth 1 https://github.com/logos-co/logos-accounts-ui.git\n```", "execs": [{"kind": "run", "cmd": "git clone --depth 1 https://github.com/logos-co/logos-accounts-ui.git", "status": "pass", "exit_code": 0, "output": "Cloning into 'logos-accounts-ui'...\n", "note": ""}]}, {"md": "## Step 2: Build the qt-mcp test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) is the harness the\ndoc-test uses to connect to the app's QML inspector and drive it. Build it\nonce and link it as `./result-mcp`.", "execs": []}, {"md": "### 2.1 Build logos-qt-mcp\n\n```bash\nnix build 'github:logos-co/logos-qt-mcp' -o result-mcp\n```", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-qt-mcp' -o result-mcp", "status": "pass", "exit_code": 0, "output": "unpacking 'github:logos-co/logos-qt-mcp/1fea509485a48ab185fafae8dc21bdbcc808a07e' into the Git cache...\nthese 4 paths will be fetched (21.5 MiB download, 111.2 MiB unpacked):\n  /nix/store/ddx7976jyll30xjbasghv9jailswprcp-bash-interactive-5.3p3\n  /nix/store/r5sn5xvbjwr9c3xd56wl5ad06f6x1ggb-libuv-1.51.0-dev\n  /nix/store/f16mglsjvixwawdx65dlc1chgwghv3fm-logos-qt-mcp\n  /nix/store/r4557ald6zn4dzmvgh8na9vwnwzgrjgc-nodejs-22.19.0\ncopying path '/nix/store/ddx7976jyll30xjbasghv9jailswprcp-bash-interactive-5.3p3' from 'https://cache.nixos.org'...\ncopying path '/nix/store/r5sn5xvbjwr9c3xd56wl5ad06f6x1ggb-libuv-1.51.0-dev' from 'https://cache.nixos.org'...\ncopying path '/nix/store/r4557ald6zn4dzmvgh8na9vwnwzgrjgc-nodejs-22.19.0' from 'https://cache.nixos.org'...\ncopying path '/nix/store/f16mglsjvixwawdx65dlc1chgwghv3fm-logos-qt-mcp' from 'https://logos-co.cachix.org'...\n", "note": ""}]}, {"md": "## Step 3: Launch the UI and exercise the module\n\nLaunch the standalone app with `nix run`, overriding the `accounts_module`\ninput so the UI runs against **this** commit of the module. The doc-test\ndrives the running app: it waits for the UI to appear, generates a mnemonic,\nand computes an entropy strength \u2014 each a real round-trip to `accounts_module`\nover the Logos bridge.\n\n> `` pins the override to the commit under test (the runner expands\n> it: locally this checkout's `HEAD`, in CI the commit being tested). With no\n> pin it falls back to the module's latest `master`.", "execs": []}, {"md": "### 3.1 Launch and drive the app\n\n```bash\nnix run ./logos-accounts-ui --override-input accounts_module github:logos-co/logos-accounts-module/4467336a46561f45f51cd6e1c6994446d9b2a510\n```\n\n![Mnemonic section visible](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdd2BUVfo38OdOn8wkmUnvlZCQDgmhSJHQBRQQEAsi9nV1LbCiq6vuuq67KvruYv2J64IgKKI0qQE0AqEEAqmEkN77ZCbTy33/uOxsNo1MREKc7+evm5lzzj33ZpI5z73POZcJCQkhAAAAAABwDryh7gAAAAAAANw4CAAAAAAAAJwIAgAAAAAAACeCAAAAAAAAwIkgAAAAAAAAcCIIAAAAAAAAnAgCAAAAAAAAJ4IAAAAAAADAiSAAAAAAAABwIggAAAAAAACcCAIAAAAAAAAnggAAAAAAAMCJIAAAAAAAAHAiCAAAAAAAAJwIAgAAAAAAACeCAAAAAAAAwIkgAAAAAAAAcCIIAAAAAAAAnAgCAAAAAAAAJyL4OZUTExPf ion is a real call into **this** `accounts_module`:\nclicking **Create Random Mnemonic** invokes\n`accounts_module.createRandomMnemonic` (the returned phrase is random, so\nwe capture it in a screenshot rather than assert on it), and **Length To\nEntropy Strength** with `12` returns exactly `128` (12 words \u2192 128 bits of\nentropy) \u2014 a deterministic, end-to-end proof the UI and this module talk\nto each other. The captured screenshots are embedded above and in the CI\nreport.", "execs": [{"kind": "ui_test", "cmd": "nix run ./logos-accounts-ui --override-input accounts_module github:logos-co/logos-accounts-module/4467336a46561f45f51cd6e1c6994446d9b2a510\n\n# test actions:\n- App window opens: wait for ['Accounts Manager']\n- Tabs are visible: wait for ['Keys', 'Keystore', 'ExtKeystore']\n- Mnemonic section visible: wait for ['Mnemonic Operations', 'Create Random Mnemonic']\n- Generate a random mnemonic: click 'Create Random Mnemonic'\n- Let the mnemonic round-trip complete: sleep 2000ms\n- Enter a mnemonic length for entropy lookup: set placeholderText='Length (12, 15, 18, 21, 24)...' to '12'\n- Compute entropy strength: click 'Length To Entropy Strength'\n- Entropy strength is 128 bits: wait for ['128']", "status": "pass", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Driving the Accounts UI Against This Module: Launch and drive the app\n\n1 passed, 0 failed\n\n", "note": ""}]}]}]}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
