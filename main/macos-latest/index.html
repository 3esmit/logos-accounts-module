d": "## Step 4: Run the daemon and call the module\n\nStart `logoscore` in daemon mode pointed at `./modules`, then use the client\nsubcommands to load `accounts_module`, introspect it, and call several of its\nmethods. Daemon output is captured in `logs.txt`.", "execs": []}, {"md": "### 4.1 Start the daemon\n\nStart logoscore in daemon mode in the background, capturing output to\n`logs.txt`:\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```\n\nThe `-D` flag starts the daemon. The client subcommands below connect to\nthis running process via the config written under `~/.logoscore/`.", "execs": [{"kind": "run", "cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "```bash\nsleep 3\n```", "execs": [{"kind": "run", "cmd": "sleep 3", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 4.2 Inspect the startup log\n\nReview the daemon's startup output:\n\n```bash\ncat logs.txt\n```", "execs": [{"kind": "run", "cmd": "cat logs.txt", "status": "pass", "exit_code": 0, "output": "[2026-07-24 09:26:50.362] [info] [logos] [capability_module] CapabilityModulePlugin: created\n[2026-07-24 09:26:50.362] [info] [logos] [capability_module] [LogosProviderObject] LogosAPIProvider: wrapping QObject in QtProviderObject for \"capability_module\"\n[2026-07-24 09:26:50.363] [info] [logos] [capability_module] qt.core.qobject.connect: QObject::connect: No such signal CapabilityModulePlugin::eventResponse(QString, QVariantList)\n[2026-07-24 09:26:50.363] [info] [logos] [capability_module] [LogosProviderObject] QtProviderObject: connected to QObject eventResponse signal\n[2026-07-24 09:26:50.363] [info] [logos] [capability_module] [LogosProviderObject] QtProviderObject: calling initLogos on wrapped QObject\n[2026-07-24 09:26:50.363] [info] [logos] [capability_module] CapabilityModulePlugin: LogosAPI initialized\n[2026-07-24 09:26:50.363] [info] [logos] [capability_module] [LogosProviderObject] ModuleProxy: created, wrapping LogosProviderObject \"capability_module\"\n[2026-07-24 09:26:50.365] [info] [logos] [capability_module] RemoteTransportHost: Created registry host with URL: \"local:logos_capability_module_e394c43c269e\"\n[2026-07-24 09:26:50.365] [info] [logos] [capability_module] RemoteTransportHost: Published object: \"capability_module\"\n[2026-07-24 09:26:50.365] [info] [logos] [capability_module] [LogosProviderObject] LogosAPIProvider: successfully published \"capability_module\"\n[2026-07-24 09:26:50.558] [info] [logos] [capability_module] [LogosProviderObject] QtProviderObject: saving token for module: \"capability_module\"\n[2026-07-24 09:26:50.558] [info] [logos] Module loaded: capability_module\nLogoscore daemon started (pid 9261, instance e394c43c269e)\nDaemon state: /tmp/doctest-test-ggav5m4g/.logoscore/daemon/state.json\nLocal client config: /tmp/doctest-test-ggav5m4g/.logoscore/client/config.json\n", "note": ""}]}, {"md": "### 4.3 Check daemon status\n\nVerify the daemon is running:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"pid\":9261,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":3,\"version\":\"1.0.0\"},{\"name\":\"accounts_module\",\"status\":\"not_loaded\",\"version\":\"1.0.1\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":1,\"not_loaded\":1}}\n", "note": ""}]}, {"md": "### 4.4 List discovered modules\n\n`accounts_module` should be visible in the scan directory:\n\n```bash\nlogoscore list-modules\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore list-modules", "status": "pass", "exit_code": 0, "output": "[{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":3,\"version\":\"1.0.0\"},{\"name\":\"accounts_module\",\"status\":\"not_loaded\",\"version\":\"1.0.1\"}]\n", "note": ""}]}, {"md": "### 4.5 Load the module\n\nLoad `accounts_module` into the running daemon:\n\n```bash\nlogoscore load-module accounts_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore load-module accounts_module", "status": "pass", "exit_code": 0, "output": "{\"dependencies_loaded\":[],\"module\":\"accounts_module\",\"status\":\"ok\",\"version\":\"1.0.1\"}\n", "note": ""}]}, {"md": "### 4.6 Confirm the module is loaded\n\nRe-run `status`; the module that was `not_loaded` before now reports\n`loaded`:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"pid\":9261,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":3,\"version\":\"1.0.0\"},{\"name\":\"accounts_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"1.0.1\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":2,\"not_loaded\":0}}\n", "note": ""}]}, {"md": "### 4.7 Introspect the module with module-info\n\n`module-info` lists the `Q_INVOKABLE` methods the module exposes \u2014 the\nsame methods you can `call`:\n\n```bash\nlogoscore module-info accounts_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore module-info accounts_module", "status": "pass", "exit_code": 0, "output": "{\"dependencies\":[],\"dependents\":[],\"events\":[],\"methods\":[{\"isInvokable\":true,\"name\":\"initKeystore\",\"parameters\":[{\"name\":\"dir\",\"type\":\"QString\"},{\"name\":\"scryptN\",\"type\":\"int\"},{\"name\":\"scryptP\",\"type\":\"int\"}],\"returnType\":\"bool\",\"signature\":\"initKeystore(QString,int,int)\"},{\"isInvokable\":true,\"name\":\"closeKeystore\",\"parameters\":[{\"name\":\"privateKey\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"closeKeystore(QString)\"},{\"isInvokable\":true,\"name\":\"keystoreAccounts\",\"returnType\":\"QStringList\",\"signature\":\"keystoreAccounts()\"},{\"isInvokable\":true,\"name\":\"keystoreNewAccount\",\"parameters\":[{\"name\":\"passphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"keystoreNewAccount(QString)\"},{\"isInvokable\":true,\"name\":\"keystoreImport\",\"parameters\":[{\"name\":\"keyJSON\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"},{\"name\":\"newPassphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"keystoreImport(QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"keystoreExport\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"},{\"name\":\"newPassphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"keystoreExport(QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"keystoreDelete\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"keystoreDelete(QString,QString)\"},{\"isInvokable\":true,\"name\":\"keystoreHasAddress\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"keystoreHasAddress(QString)\"},{\"isInvokable\":true,\"name\":\"keystoreUnlock\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"keystoreUnlock(QString,QString)\"},{\"isInvokable\":true,\"name\":\"keystoreLock\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"keystoreLock(QString)\"},{\"isInvokable\":true,\"name\":\"keystoreTimedUnlock\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"},{\"name\":\"timeoutSeconds\",\"type\":\"int\"}],\"returnType\":\"bool\",\"signature\":\"keystoreTimedUnlock(QString,QString,int)\"},{\"isInvokable\":true,\"name\":\"keystoreUpdate\",\"parameters\":[{\"name\":\"address\",\"type\" \":\"scryptN\",\"type\":\"int\"},{\"name\":\"scryptP\",\"type\":\"int\"}],\"returnType\":\"bool\",\"signature\":\"initExtKeystore(QString,int,int)\"},{\"isInvokable\":true,\"name\":\"closeExtKeystore\",\"returnType\":\"bool\",\"signature\":\"closeExtKeystore()\"},{\"isInvokable\":true,\"name\":\"extKeystoreAccounts\",\"returnType\":\"QStringList\",\"signature\":\"extKeystoreAccounts()\"},{\"isInvokable\":true,\"name\":\"extKeystoreNewAccount\",\"parameters\":[{\"name\":\"passphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"extKeystoreNewAccount(QString)\"},{\"isInvokable\":true,\"name\":\"extKeystoreImport\",\"parameters\":[{\"name\":\"keyJSON\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"},{\"name\":\"newPassphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"extKeystoreImport(QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"extKeystoreImportExtendedKey\",\"parameters\":[{\"name\":\"extKeyStr\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"extKeystoreImportExtendedKey(QString,QString)\"},{\"isInvokable\":true,\"name\":\"extKeystoreExportExt\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"},{\"name\":\"newPassphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"extKeystoreExportExt(QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"extKeystoreExportPriv\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"},{\"name\":\"newPassphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"extKeystoreExportPriv(QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"extKeystoreDelete\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"extKeystoreDelete(QString,QStr e\":\"QString\",\"signature\":\"extKeystoreSignTx(QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"extKeystoreSignTxWithPassphrase\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"},{\"name\":\"txJSON\",\"type\":\"QString\"},{\"name\":\"chainIDHex\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"extKeystoreSignTxWithPassphrase(QString,QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"extKeystoreDerive\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"derivationPath\",\"type\":\"QString\"},{\"name\":\"pin\",\"type\":\"int\"}],\"returnType\":\"QString\",\"signature\":\"extKeystoreDerive(QString,QString,int)\"},{\"isInvokable\":true,\"name\":\"extKeystoreDeriveWithPassphrase\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"derivationPath\",\"type\":\"QString\"},{\"name\":\"pin\",\"type\":\"int\"},{\"name\":\"passphrase\",\"type\":\"QString\"},{\"name\":\"newPassphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"extKeystoreDeriveWithPassphrase(QString,QString,int,QString,QString)\"},{\"isInvokable\":true,\"name\":\"extKeystoreFind\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"url\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"extKeystoreFind(QString,QString)\"},{\"isInvokable\":true,\"name\":\"createExtKeyFromMnemonic\",\"parameters\":[{\"name\":\"phrase\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"createExtKeyFromMnemonic(QString,QString)\"},{\"isInvokable\":true,\"name\":\"deriveExtKey\",\"parameters\":[{\"name\":\"extKeyStr\",\"type\":\"QString\"},{\"name\":\"pathStr\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"deriveExtKey(QString,QString)\"},{\"isInvokable\":true,\"name\":\"extKeyToECDSA\",\"parameters\":[{\"name\":\"extKeyStr\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"extKeyToECDSA(QString)\"},{\"isInvokable\":true,\"name\":\"ecdsaToPublicKey\",\"parameters\":[{\"name\":\"privateKeyECDSAStr\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"ecdsaToPublicKey(QString)\"},{\"isInvokable\":true,\"name\":\"publicKeyToAddress\",\"parameters\":[{\"name\":\"publicKeyStr\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"publicKeyToAddress(QString)\"},{\"isInvokable\":true,\"name\":\"createRandomMnemonic\",\"parameters\":[{\"name\":\"length\",\"type\":\"int\"}],\"returnType\":\"QString\",\"signature\":\"createRandomMnemonic(int)\"},{\"isInvokable\":true,\"name\":\"createRandomMnemonicWithDefaultLength\",\"returnType\":\"QString\",\"signature\":\"createRandomMnemonicWithDefaultLength()\"},{\"isInvokable\":true,\"name\":\"lengthToEntropyStrength\",\"parameters\":[{\"name\":\"length\",\"type\":\"int\"}],\"returnType\":\"int\",\"signature\":\"lengthToEntropyStrength(int)\"}],\"name\":\"accounts_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"1.0.1\"}\n", "note": ""}]}, {"md": "### 4.8 Generate a random mnemonic\n\n`createRandomMnemonic` takes a word count and returns a fresh BIP-39\nphrase \u2014 a real round-trip through the go-wallet-sdk C library wrapped by\nthe module, dispatched over liblogos' IPC:\n\n```bash\nlogoscore call accounts_module createRandomMnemonic 12\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module createRandomMnemonic 12", "status": "pass", "exit_code": 0, "output": "{\"method\":\"createRandomMnemonic\",\"module\":\"accounts_module\",\"result\":\"supply story helmet phrase hard off join aunt ill plunge inspire cube\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.9 Generate a default-length mnemonic\n\n`createRandomMnemonicWithDefaultLength` takes no arguments and returns a\nphrase of the SDK's default length:\n\n```bash\nlogoscore call accounts_module createRandomMnemonicWithDefaultLength\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module createRandomMnemonicWithDefaultLength", "status": "pass", "exit_code": 0, "output": "{\"method\":\"createRandomMnemonicWithDefaultLength\",\"module\":\"accounts_module\",\"result\":\"garden opinion damage occur salt frozen opera candy exchange mix sketch add\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.10 Map a word count to entropy strength\n\n`lengthToEntropyStrength` maps a mnemonic word count to its entropy\nstrength in bits \u2014 12 words is 128 bits. This exercises an `int`\nround-trip:\n\n```bash\nlogoscore call accounts_module lengthToEntropyStrength 12\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module lengthToEntropyStrength 12", "status": "pass", "exit_code": 0, "output": "{\"method\":\"lengthToEntropyStrength\",\"module\":\"accounts_module\",\"result\":128,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nlogoscore call accounts_module lengthToEntropyStrength 24\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module lengthToEntropyStrength 24", "status": "pass", "exit_code": 0, "output": "{\"method\":\"lengthToEntropyStrength\",\"module\":\"accounts_module\",\"result\":256,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.11 Create and use a keystore\n\nInitialise a keystore in a fresh directory (`scryptN`=4096, `scryptP`=6\nkeep the test fast), then create a new account in it. `keystoreNewAccount`\nreturns the new account's address:\n\n```bash\nlogoscore call accounts_module initKeystore ./ks 4096 6\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module initKeystore ./ks 4096 6", "status": "pass", "exit_code": 0, "output": "{\"method\":\"initKeystore\",\"module\":\"accounts_module\",\"result\":true,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nlogoscore call accounts_module keystoreNewAccount test-passphrase\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module keystoreNewAccount test-passphrase", "status": "pass", "exit_code": 0, "output": "{\"method\":\"keystoreNewAccount\",\"module\":\"accounts_module\",\"result\":\"{\\\"address\\\":\\\"0x571e7Ad1430AaC13f8C574458B3d3A3F5539839C\\\",\\\"url\\\":\\\"keystore:///private/tmp/doctest-test-ggav5m4g/ks/UTC--2026-07-24T09-26-53.849671000Z--571e7ad1430aac13f8c574458b3d3a3f5539839c\\\"}\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.12 List the keystore's accounts\n\n`keystoreAccounts` returns the accounts now present in the keystore \u2014 the\none we just created:\n\n```bash\nlogoscore call accounts_module keystoreAccounts\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module keystoreAccounts", "status": "pass", "exit_code": 0, "output": "{\"method\":\"keystoreAccounts\",\"module\":\"accounts_module\",\"result\":[\"{\\\"address\\\":\\\"0x571e7Ad1430AaC13f8C574458B3d3A3F5539839C\\\",\\\"url\\\":\\\"keystore:///private/tmp/doctest-test-ggav5m4g/ks/UTC--2026-07-24T09-26-53.849671000Z--571e7ad1430aac13f8c574458b3d3a3f5539839c\\\"}\"],\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.13 Stop the daemon\n\nShut the daemon down cleanly:\n\n```bash\nlogoscore stop\n```\n\nThe daemon removes its state file and exits.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore stop", "status": "pass", "exit_code": 0, "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nsleep 2\n```", "execs": [{"kind": "run", "cmd": "sleep 2", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 4.14 Confirm the daemon has stopped\n\nWith no daemon running, the client reports `not_running` and exits\nnon-zero, so we add `|| true` to let the doc-test assert on the output:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status || true", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"instance_id\":\"e394c43c269e\",\"status\":\"not_running\",\"version\":\"pre-release-f4753dd\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "note": ""}]}]}, {"meta": {"name": "Driving the Accounts UI Against This Module", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"md": "# Driving the Accounts UI Against This Module\n\nThe companion to the [headless runtime doc-test](accounts-module-runtime.md):\ninstead of calling `accounts_module` through the `logoscore` daemon, this one\ndrives the real **[`logos-accounts-ui`](https://github.com/logos-co/logos-accounts-ui)**\ndesktop app against **this** commit of the module.\n\n`logos-accounts-ui` is a QML UI plugin built with\n[`logos-app-builder`](https://github.com/logos-co/logos-app-builder), so its\nflake exposes a standalone app (`apps.default`) that `nix run` launches in its\nown window with all backend module dependencies bundled and auto-loaded. The\nUI declares `accounts_module` as a flake input, so we build the app with an\n`--override-input` that points that input at the commit under test. The UI then\ntalks to **this** module over the Logos IPC bridge, exactly as it would in\n`logos-basecamp`.\n\nThe app is launched headless (`QT_QPA_PLATFORM=offscreen`) and driven through\nthe QML inspector via [`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp):\nwe wait for elements to appear, type into inputs, click buttons, assert on the\nresults the module returns, and capture screenshots that are embedded in the\nrendered tutorial and the CI report.\n\n**What you'll build:** The `logos-accounts-ui` standalone app, built against this `accounts_module` commit and driven headlessly through its QML UI.\n\n**What you'll learn:**\n\n- How a UI built with `logos-app-builder` exposes a standalone `nix run` app\n- How to override the UI's module input so it runs against a specific module commit\n- How to drive a headless Qt/QML app with logos-qt-mcp (wait, type, click, assert)\n- How to capture screenshots of the running UI for documentation and CI reports\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **A Linux or macOS machine.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required.", "execs": []}, {"md": "## How the standalone UI app works\n\n`logos-accounts-ui` is a QML UI plugin (`accounts_ui`) that declares\n`accounts_module` as a dependency. Because it is built with\n`logos-app-builder`, its flake's `apps.default` is a self-contained desktop\napp:\n\n```\n+----------------------+   backend.createRandomMnemonic()   +-------------------+\n|     accounts_ui      | --------------------------------->  |  accounts_module  |\n|  AccountsView.qml    |   IPC (Logos API bridge)            |   C++ plugin      |\n+----------------------+                                     +-------------------+\n           ^                                                          ^\n           \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 bundled & launched by \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                           logos-app-builder standalone app\n```\n\nThe standalone app bundles every module dependency (here `accounts_module`)\nand loads it automatically at startup \u2014 so when the QML calls\n`backend.lengthToEntropyStrength(12)`, the call travels over the Logos bridge\nto the real module and comes back with `128`. By overriding the\n`accounts_module` input at build time we make that backend **this** commit.", "execs": []}, {"md": "## Step 1: Clone the UI\n\nClone [`logos-accounts-ui`](https://github.com/logos-co/logos-accounts-ui).\nWe clone over HTTPS so the step works in CI; over SSH the URL is\n`git@github.com:logos-co/logos-accounts-ui.git`.", "execs": []}, {"md": "### 1.1 git clone\n\n```bash\ngit clone --depth 1 https://github.com/logos-co/logos-accounts-ui.git\n```", "execs": [{"kind": "run", "cmd": "git clone --depth 1 https://github.com/logos-co/logos-accounts-ui.git", "status": "pass", "exit_code": 0, "output": "Cloning into 'logos-accounts-ui'...\n", "note": ""}]}, {"md": "## Step 2: Build the qt-mcp test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) is the harness the\ndoc-test uses to connect to the app's QML inspector and drive it. Build it\nonce and link it as `./result-mcp`.", "execs": []}, {"md": "### 2.1 Build logos-qt-mcp\n\n```bash\nnix build 'github:logos-co/logos-qt-mcp' -o result-mcp\n```", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-qt-mcp' -o result-mcp", "status": "pass", "exit_code": 0, "output": "unpacking 'github:logos-co/logos-qt-mcp/1fea509485a48ab185fafae8dc21bdbcc808a07e' into the Git cache...\nthese 4 paths will be fetched (16.7 MiB download, 99.1 MiB unpacked):\n  /nix/store/dgfikfjky3nq6gycpd08fyvmr7ww1j7j-bash-interactive-5.3p3\n  /nix/store/hbbyr0434ww52i6bph4lyswm76ixzpcw-libuv-1.51.0-dev\n  /nix/store/0pvy2s1y0i9s7k7smvx3a3bxgxdg9mwf-logos-qt-mcp\n  /nix/store/3scj3c1qxh5iclf8jy5hbl9pki40y77n-nodejs-22.19.0\ncopying path '/nix/store/dgfikfjky3nq6gycpd08fyvmr7ww1j7j-bash-interactive-5.3p3' from 'https://cache.nixos.org'...\ncopying path '/nix/store/hbbyr0434ww52i6bph4lyswm76ixzpcw-libuv-1.51.0-dev' from 'https://cache.nixos.org'...\ncopying path '/nix/store/3scj3c1qxh5iclf8jy5hbl9pki40y77n-nodejs-22.19.0' from 'https://cache.nixos.org'...\ncopying path '/nix/store/0pvy2s1y0i9s7k7smvx3a3bxgxdg9mwf-logos-qt-mcp' from 'https://logos-co.cachix.org'...\n", "note": ""}]}, {"md": "## Step 3: Launch the UI and exercise the module\n\nLaunch the standalone app with `nix run`, overriding the `accounts_module`\ninput so the UI runs against **this** commit of the module. The doc-test\ndrives the running app: it waits for the UI to appear, generates a mnemonic,\nand computes an entropy strength \u2014 each a real round-trip to `accounts_module`\nover the Logos bridge.\n\n> `` pins the override to the commit under test (the runner expands\n> it: locally this checkout's `HEAD`, in CI the commit being tested). With no\n> pin it falls back to the module's latest `master`.", "execs": []}, {"md": "### 3.1 Launch and drive the app\n\n```bash\nnix run ./logos-accounts-ui --override-input accounts_module github:logos-co/logos-accounts-module/add06cc6f0dc9a0f49d98030bbc636df29fc834c\n```\n\n![Mnemonic section visible](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeXwU5f0H8O/M3kc2x+a+CLkTCAGSAAHCFaAhyKEUW8+KrVqtWq1Hq9V6VPurRyvFu6JCW6qgAsohHtxHuJNAEkLu+042m93svTu/PwbXbS6yAYywn/cfvpaZ53nmO5Md9/nOPPMMExkZSQAAAAAA4BnY0Q4AAAAAAAB+OEgAAAAAAAA8CBIAAAAAAAAPggQAAAAAAMCDIAEAAAAAAPAgSAAAAAAAADwIEgAAAAAAAA+CBAAAAAAAwIMgAQAAAAAA8CBIAAAAAAAAPAgSAAAAAAAAD4IEAAAAAADAgyABAAAAAADwIEgAAAAAAAA8CBIAAAAAAAAPggQAAAAAAMCDIAEAAAAAAPAgSAAAAAAAADwIEgAAAAAAAA8ivJTKkyZN+sc//sF/fu2117Zs2XI5QrrixGJxWloaEbW3t1dUVLhV9+GHH77++uuJqK6u7tZbb+2z9oEHHli5ciURNTY23nTTTZcpXgAAAACAy+aS7gBkZ2c7P8+bN++Sg/mB+Pv7v/TSSy+99NJtt93mbl2GYfgPkZGRycnJrqsEAsGCBQv4zyyLWysAAAAA8GM08n6qQCCYPXu2858TJkwIDAy8HCFdNRYtWuT6z8zMTB8fn9EKBgAAAABgOEY+BCgjI8Pb25uIDh8+PGPGDIZh5s6du3HjRmeB8PDw5cuXp6SkxMTENDQ0lJaWrl27tqOjYzhrAwICbrjhhtTU1Li4uNra2sLCwi+++KK2tpaI5syZw4+uee+9906ePMk39fTTTxPRvn37Pvroo2effTYkJESv17/++ut333335MmTDQbDkSNH3nrrLYPBcPvtt8+dO9e5C+++++7x48fff/99Pz+/u+66KykpKSwsrK2traKi4oMPPuC3OJiFCxeuWbPGarXy/+yTD/BkMtntt98+efLkqKgoo9FYUVGxdevWQ4cOEVFaWtrdd99NRBs3bgwLC8vOzg4PD6+pqXnvvfeOHTvGV58wYcItt9wSHR3t5+dXV1d39uzZd999t7e3l187adKkRYsW8Tv49ddfV1ZW3nHHHUS0YcOGAwcOEFFgYOCKFSsmTZoUFRV1/vz5/Pz8jz/+2GAwuG5906ZNiYmJM2bMYFn25z//uXtfAgAAAAC42ow8AXCO/3nrrbcmTpyoUCiys7OdCUBQUNDq1aud9wSio6Ojo6MzMjIeeuih+vr6odf ble: wait for ['Keys', 'Keystore', 'ExtKeystore']\n- Mnemonic section visible: wait for ['Mnemonic Operations', 'Create Random Mnemonic']\n- Generate a random mnemonic: click 'Create Random Mnemonic'\n- Let the mnemonic round-trip complete: sleep 2000ms\n- Enter a mnemonic length for entropy lookup: set placeholderText='Length (12, 15, 18, 21, 24)...' to '12'\n- Compute entropy strength: click 'Length To Entropy Strength'\n- Entropy strength is 128 bits: wait for ['128']", "status": "pass", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Driving the Accounts UI Against This Module: Launch and drive the app\n\n1 passed, 0 failed\n\n", "note": ""}]}]}]}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
